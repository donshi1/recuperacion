<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Integrador & Banco</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; }
        nav { background-color: #1e1e1e; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; }
        nav .brand { font-size: 1.2em; font-weight: bold; color: #fff; }
        nav button { background: #333; color: white; border: none; padding: 8px 15px; margin-left: 5px; cursor: pointer; border-radius: 4px; transition: 0.3s; }
        nav button:hover { background: #555; }
        .container { padding: 20px; max-width: 900px; margin: auto; }
        .section { display: none; animation: fadeIn 0.3s; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card { background: #1e1e1e; padding: 20px; margin: 15px 0; border-radius: 8px; border: 1px solid #333; }
        input { padding: 10px; margin: 8px 0; width: 100%; box-sizing: border-box; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 4px; }
        .btn-primary { background: #007bff; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 4px; font-weight: bold; margin-top: 10px; }
        .btn-primary:hover { background: #0056b3; }
        .grid-productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
    </style>
</head>
<body>

    <nav>
        <div>
            <span class="brand">Tienda Anime</span>
            <button onclick="mostrarSeccion('tienda')">Tienda</button>
            <button id="btn-banco" onclick="mostrarSeccion('banco')" style="display:none;">Mi Banco</button>
            <button id="btn-pedidos" onclick="mostrarSeccion('pedidos')" style="display:none;">Historial</button>
        </div>
        <div>
            <span id="user-info" style="margin-right: 10px; font-size: 0.9em;">Invitado</span>
            <button id="btn-login" onclick="mostrarSeccion('login')">Entrar</button>
            <button id="btn-logout" onclick="cerrarSesion()" style="display:none; background: #dc3545;">Salir</button>
        </div>
    </nav>

    <div class="container">

        <div id="tienda" class="section active">
            <h2>Catálogo de Productos</h2>
            <div id="lista-productos" class="grid-productos">Cargando productos...</div>
        </div>

        <div id="login" class="section">
            <h2>Iniciar Sesión</h2>
            <div class="card" style="max-width: 400px; margin: auto;">
                <input type="email" id="email" placeholder="Correo electrónico">
                <input type="password" id="password" placeholder="Contraseña">
                <button class="btn-primary" onclick="iniciarSesion()">Ingresar</button>
            </div>
        </div>

        <div id="banco" class="section">
            <h2>Panel Bancario Seguro</h2>
            <div class="card">
                <h3 style="color: #28a745;">Saldo Disponible: $<span id="saldo-display">1000.00</span></h3>
                <hr style="border-color: #333;">
                <h4>Realizar Pago / Transferencia</h4>
                <input type="text" id="cuenta-destino" placeholder="Destino (Ej. ACC002)">
                <input type="number" id="monto-transferencia" placeholder="Monto a transferir">
                <button class="btn-primary" onclick="procesarTransferencia()">Autorizar Transferencia</button>
            </div>
        </div>

        <div id="pedidos" class="section">
            <h2>Historial de Movimientos</h2>
            <div class="card">
                <ul id="lista-movimientos" style="list-style: none; padding: 0;">
                    <li style="padding: 10px; border-bottom: 1px solid #333;">Aún no hay movimientos registrados en esta sesión.</li>
                </ul>
            </div>
        </div>
    </div>

    <script>

        const supabaseUrl = 'https://yqvzhdhxmjprkjaxgoaj.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlndnpoZGh4bWpwcmtqYXhnb2FqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2ODQ5NTksImV4cCI6MjEwMzI2MDk1OX0.I6AQpVjlF8rHqjDx0ZYUa66Q-G9v9nLiAwtDf13uI-o'; 

        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        const backendUrl = 'https://recuperacion-e6qj.onrender.com';
        let sessionToken = null;

        function mostrarSeccion(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        async function iniciarSesion() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
     
            const { data, error } = await clienteSupabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                alert("Error de acceso: Credenciales incorrectas.");
            } else {
                sessionToken = data.session.access_token;
                document.getElementById('user-info').innerText = data.user.email;
                document.getElementById('btn-login').style.display = 'none';
                document.getElementById('btn-logout').style.display = 'inline-block';
                document.getElementById('btn-banco').style.display = 'inline-block';
                document.getElementById('btn-pedidos').style.display = 'inline-block';
                mostrarSeccion('tienda');
                alert("¡Sesión iniciada correctamente!");
            }
        }

        async function cerrarSesion() {

            await clienteSupabase.auth.signOut();
            
            sessionToken = null;
            document.getElementById('user-info').innerText = 'Invitado';
            document.getElementById('btn-login').style.display = 'inline-block';
            document.getElementById('btn-logout').style.display = 'none';
            document.getElementById('btn-banco').style.display = 'none';
            document.getElementById('btn-pedidos').style.display = 'none';
            mostrarSeccion('tienda');
        }

        async function cargarProductos() {
            try {
                const response = await fetch(`${backendUrl}/api/productos`);
                const productos = await response.json();
                const contenedor = document.getElementById('lista-productos');
                contenedor.innerHTML = '';
                productos.forEach(p => {
                    contenedor.innerHTML += `
                        <div class="card">
                            <h3 style="margin-top:0;">${p.nombre}</h3>
                            <p style="font-size: 1.2em; color: #28a745;">$${p.precio} MXN</p>
                            <button class="btn-primary" onclick="comprar('${p.nombre}', ${p.precio})">Comprar Artículo</button>
                        </div>
                    `;
                });
            } catch (error) {
                document.getElementById('lista-productos').innerText = "Error conectando con el servidor Flask.";
            }
        }

        async function comprar(nombre, precio) {
            if (!sessionToken) {
                alert("Seguridad: Debes iniciar sesión para realizar compras.");
                mostrarSeccion('login');
                return;
            }
            ejecutarPagoSeguro(`Compra: ${nombre}`, precio);
        }

        async function procesarTransferencia() {
            const destino = document.getElementById('cuenta-destino').value;
            const monto = parseFloat(document.getElementById('monto-transferencia').value);
            if (!destino || !monto) {
                alert("Por favor llena todos los campos de la transferencia.");
                return;
            }
            ejecutarPagoSeguro(`Transferencia a: ${destino}`, monto);
        }

        async function ejecutarPagoSeguro(concepto, monto) {
            if (!sessionToken) return;
            try {
                const response = await fetch(`${backendUrl}/api/pagar`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sessionToken}`
                    },
                    body: JSON.stringify({ concepto, monto })
                });
                const data = await response.json();
                if (response.ok) {
                    alert(`¡Éxito! ${data.mensaje}`);
                    const lista = document.getElementById('lista-movimientos');
                    const fecha = new Date().toLocaleString();
                    lista.innerHTML = `<li style="padding: 10px; border-bottom: 1px solid #333;"><strong>${concepto}</strong> - $${monto} <span style="color:#28a745; float:right;">[${data.estado}]</span><br><small style="color:#888;">${fecha}</small></li>` + lista.innerHTML;
                } else {
                    alert("Operación denegada: " + data.error);
                }
            } catch (error) {
                alert("Error crítico: No se pudo establecer conexión segura.");
            }
        }

        cargarProductos();
    </script>
</body>
</html>
