<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Anime Store Ti5</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: white; text-align: center; }
        .grid { display: flex; justify-content: center; gap: 20px; margin-top: 50px; }
        .card { background: #333; padding: 20px; border-radius: 10px; width: 200px; }
    </style>
</head>
<body>
    <h1>Tienda Anime Exclusiva</h1>
    <div class="grid" id="catalogo"></div>

    <script>
        fetch('https://recuperacion-oxgi.onrender.com/')
            .then(res => res.json())
            .then(data => {
                const catalogo = document.getElementById('catalogo');
                data.forEach(prod => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    
                    const titulo = document.createElement('h3');
                    titulo.textContent = prod.nombre; // Inmune a XSS
                    
                    const precio = document.createElement('p');
                    precio.textContent = `$${prod.precio} MXN`;
                    
                    div.appendChild(titulo);
                    div.appendChild(precio);
                    catalogo.appendChild(div);
                });
            });
    </script>
</body>
</html>
